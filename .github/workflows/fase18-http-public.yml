name: HTTP real sin credenciales - laboratorio
on:
  push:
    branches: [integracion-inventario-fase15]
    paths:
      - 'tests/fase18-http-public.test.mjs'
      - '.github/workflows/fase18-http-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar rechazos HTTP reales sin credenciales
        run: node --test tests/fase18-http-public.test.mjs
