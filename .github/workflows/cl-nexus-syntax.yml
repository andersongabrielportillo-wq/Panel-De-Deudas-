name: CL Nexus inline JavaScript syntax
on:
  push:
    branches:
      - integracion-inventario-fase15
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse inline JavaScript in both PWAs
        run: node scripts/check-inline-js.cjs
      - name: Verify CL Nexus RPC adapters
        run: node --test tests/cl-nexus-adapters.test.cjs
