name: PostgreSQL efimero - migraciones de contratos
on:
  push:
    branches: [integracion-inventario-fase15]
    paths:
      - 'tests/postgres/**'
      - 'scripts/prepare-cln-inventory-import.mjs'
      - 'tests/fixtures/generate-synthetic-cln-stock.mjs'
      - 'sql/cl_nexus_schema_lab_SNAPSHOT_SOLO_ENSAYO_NO_PRODUCCION.sql'
      - 'migrations/20261115_fase15*.sql'
      - '.github/workflows/postgres-contratos.yml'
  pull_request:
    paths:
      - 'tests/postgres/**'
      - 'sql/cl_nexus_schema_lab_SNAPSHOT_SOLO_ENSAYO_NO_PRODUCCION.sql'
      - 'migrations/20261115_fase15*.sql'
      - '.github/workflows/postgres-contratos.yml'
permissions:
  contents: read
jobs:
  postgres-migraciones:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temporal_ci
          POSTGRES_DB: contratos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contratos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: temporal_ci
      PGDATABASE: contratos_ci
    steps:
      - uses: actions/checkout@v4
      - name: Crear dependencias ficticias en PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/fixture_minima.sql
      - name: Instalar migraciones y verificar tablas y funciones
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/aplicar_migraciones.sql
      - name: Validar vendedores manuales y permisos con PostgreSQL real
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/vendedores_roles.sql
      - name: Validar clientes y contratos borrador sin descontar stock
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/contratos_borradores.sql
      - name: Validar ventas, idempotencia y rollback con motor ficticio de stock
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/ventas_stock_ficticio.sql
      - name: Verificar permisos de roles PostgreSQL y accesos directos
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/permisos_roles_reales.sql

  postgres-motor-autentico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temporal_ci
          POSTGRES_DB: contratos_real_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contratos_real_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: temporal_ci
      PGDATABASE: contratos_real_ci
    steps:
      - uses: actions/checkout@v4
      - name: Crear esquema aislado compatible con motor autentico
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/fixture_motor_autentico.sql
      - name: Instalar funciones originales de inventario
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/motor_autentico_funciones.sql
      - name: Aplicar migraciones reales de contratos
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/aplicar_migraciones.sql
      - name: Preparar vendedores y clientes ficticios
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/vendedores_roles.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/contratos_borradores.sql
      - name: Ejecutar venta E2E con motor autentico de inventario
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/ventas_motor_autentico.sql
      - name: Verificar multibodega, secretaria y vendedor inactivo en motor original
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/ventas_motor_autentico_multibodega.sql
      - name: Confirmaciones simultaneas reales en dos sesiones PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/concurrencia_preparar.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/concurrencia_confirmar.sql > /tmp/ci-confirmacion-1.log 2>&1 &
          p1=$!
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/concurrencia_confirmar.sql > /tmp/ci-confirmacion-2.log 2>&1 &
          p2=$!
          wait "$p1"
          wait "$p2"
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/concurrencia_verificar.sql

  inventario-schema-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temporal_ci
          POSTGRES_DB: inventario_schema_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventario_schema_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: temporal_ci
      PGDATABASE: inventario_schema_ci
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable Supabase auth extension stubs
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN; CREATE ROLE anon NOLOGIN;"
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres/inventory_snapshot_fixture.sql
      - name: Test real pg_dump and pg_restore of synthetic Deudas before inventory migration
        shell: bash
        run: |
          set -euo pipefail
          baseline_sql="SELECT encode(extensions.digest(convert_to(coalesce(string_agg(id||'='||data::text,'|' ORDER BY id),''),'UTF8'),'sha256'),'hex') FROM public.debts"
          psql -X -Atq -c "$baseline_sql" > /tmp/cln_before_debts_sha
          pg_dump --format=custom --no-owner --no-privileges --file=/tmp/cln_pre_cutover.dump
          createdb cln_restored_backup_ci
          pg_restore --exit-on-error --no-owner --no-privileges --dbname=cln_restored_backup_ci /tmp/cln_pre_cutover.dump
          PGDATABASE=cln_restored_backup_ci psql -X -Atq -c "$baseline_sql" > /tmp/cln_after_restore_sha
          cmp /tmp/cln_before_debts_sha /tmp/cln_after_restore_sha
          PGDATABASE=cln_restored_backup_ci psql -X -Atq -c "SELECT (SELECT count(*) FROM public.debts WHERE id='__shared_state__')=1 AND (SELECT count(*) FROM public.workspace_members)=3 AND (SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename IN ('debts','transactions'))=8" | grep -qx t
      - name: Install complete lab inventory schema snapshot WITHOUT data
        run: psql -X -v ON_ERROR_STOP=1 -f sql/cl_nexus_schema_lab_SNAPSHOT_SOLO_ENSAYO_NO_PRODUCCION.sql
      - name: Verify all inventory objects, RLS, API privileges and no copied data
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/inventory_snapshot_assertions.sql
      - name: Reject outsiders and missing-secretary role mapping without mutating inventory members
        shell: bash
        run: |
          set -euo pipefail
          if psql -X -v ON_ERROR_STOP=1 -v roles_json='[{"user_id":"00000000-0000-0000-0000-000000000002","rol":"admin"},{"user_id":"00000000-0000-0000-0000-000000000003","rol":"secretaria"},{"user_id":"00000000-0000-0000-0000-000000000099","rol":"admin"}]' -f sql/cl_nexus_roles_provision_PREPARADO_NO_EJECUTAR.sql > /tmp/cln_rejected_outsider.log 2>&1; then
            echo 'Outsider mapping must fail'; exit 1
          fi
          psql -X -Atq -c "SELECT count(*) FROM public.inv_members" | grep -qx 0
          if psql -X -v ON_ERROR_STOP=1 -v roles_json='[{"user_id":"00000000-0000-0000-0000-000000000002","rol":"admin"}]' -f sql/cl_nexus_roles_provision_PREPARADO_NO_EJECUTAR.sql > /tmp/cln_rejected_incomplete.log 2>&1; then
            echo 'No-secretary mapping must fail'; exit 1
          fi
          psql -X -Atq -c "SELECT count(*) FROM public.inv_members" | grep -qx 0
      - name: Assign only owner and secretary; leave third Deudas account outside inventory
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -v roles_json='[{"user_id":"00000000-0000-0000-0000-000000000002","rol":"admin"},{"user_id":"00000000-0000-0000-0000-000000000003","rol":"secretaria"}]' -f sql/cl_nexus_roles_provision_PREPARADO_NO_EJECUTAR.sql
          psql -X -Atq -c "SELECT (SELECT count(*) FROM public.inv_members)=2 AND (SELECT count(*) FROM public.inv_members WHERE rol='admin')=1 AND (SELECT count(*) FROM public.inv_members WHERE rol='secretaria')=1 AND NOT EXISTS (SELECT 1 FROM public.inv_members WHERE user_id='00000000-0000-0000-0000-000000000004')" | grep -qx t
      - name: Confirm unauthorized third user cannot invoke CL Nexus API
        shell: bash
        run: |
          set -euo pipefail
          if psql -X -v ON_ERROR_STOP=1 -c "BEGIN; SET LOCAL ROLE authenticated; SELECT set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000004',true); SELECT * FROM public.inv_catalogo_vendedores(); ROLLBACK;" > /tmp/cln_denied_third.log 2>&1; then
            echo 'Deudas-only user must not read CL Nexus'; exit 1
          fi
          if ! grep -qi 'No autorizado' /tmp/cln_denied_third.log; then
            echo 'Third-user request failed for a reason other than authorization'; cat /tmp/cln_denied_third.log; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate fake approved inventory SQL (never real MERCADERIA records)
        shell: bash
        run: |
          set -euo pipefail
          node tests/fixtures/generate-synthetic-cln-stock.mjs /tmp/ci-fake-stock.clnimport.sql
          test -s /tmp/ci-fake-stock.clnimport.sql
      - name: Seed only default inventory locations in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.inv_locations(id,nombre) VALUES (1,'Oficina'),(2,'Bodega'),(3,'Garantía'),(4,'Proveedor/Taller')"
      - name: Execute fake stock import and check count, warehouse isolation and Deudas integrity
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f /tmp/ci-fake-stock.clnimport.sql
          psql -X -Atq -c "SELECT (SELECT count(*) FROM public.inv_items)=190 AND (SELECT count(*) FROM public.inv_stock)=190 AND (SELECT coalesce(sum(cantidad),0) FROM public.inv_stock)=380 AND (SELECT count(*) FROM public.inv_stock WHERE location_id=1)=95 AND (SELECT count(*) FROM public.inv_stock WHERE location_id=2)=95 AND (SELECT count(*) FROM public.inv_stock WHERE location_id IN (3,4))=0 AND (SELECT count(*) FROM public.debts)=1" | grep -qx t
          psql -X -Atq -c "SELECT encode(extensions.digest(convert_to(coalesce(string_agg(id||'='||data::text,'|' ORDER BY id),''),'UTF8'),'sha256'),'hex') FROM public.debts" > /tmp/cln_after_fake_inventory_sha
          cmp /tmp/cln_before_debts_sha /tmp/cln_after_fake_inventory_sha
      - name: Replaying initial stock import must be refused atomically
        shell: bash
        run: |
          set -euo pipefail
          if psql -X -v ON_ERROR_STOP=1 -f /tmp/ci-fake-stock.clnimport.sql > /tmp/cln_replay.log 2>&1; then
            echo 'Initial inventory import unexpectedly accepted a replay'; exit 1
          fi
          grep -q 'Stock no vacío; no se puede repetir carga' /tmp/cln_replay.log
          psql -X -Atq -c "SELECT (SELECT count(*) FROM public.inv_items)=190 AND (SELECT count(*) FROM public.inv_stock)=190 AND (SELECT coalesce(sum(cantidad),0) FROM public.inv_stock)=380" | grep -qx t
