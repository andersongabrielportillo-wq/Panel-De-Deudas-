name: CL Nexus integration tests
on:
  push:
    branches: [integracion-inventario-fase15]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check debt-legacy-backup.cjs
          node --check debt-encrypted-backup.cjs
          node --check debt-cache-preflight.cjs
          node --check debt-gate-client.cjs
          node --check debt-module-controller.cjs
          node --check scripts/build-cln-candidate.mjs
          node --check cln-http-auth-probe.cjs
          node --check scripts/prepare-cln-inventory-import.mjs
          node --check scripts/prepare-cln-catalog-2026-3.mjs
      - name: Run debt backup tests
        run: node --test tests/cln-http-auth-probe.test.mjs tests/cln-catalog-only.test.mjs tests/cln-item-rename.test.mjs tests/cln-inventory-import-guard.test.mjs tests/cln-customer-search.test.mjs tests/cln-cutover-candidate.test.mjs tests/cl-nexus-rpc-parity.test.mjs tests/debt-production-rpc-contract.test.mjs tests/debt-legacy-backup.test.mjs tests/debt-encrypted-backup.test.mjs tests/debt-migration-isolated.test.mjs tests/debt-main-screen.test.mjs tests/debt-cache-preflight.test.mjs tests/debt-gate-client.test.mjs tests/debt-module-controller.test.mjs tests/debt-gate-integration.test.mjs
      - name: Upload gated preview artifact (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: cln-pwa-CANDIDATA-NO-PUBLICAR
          path: dist-cln-candidate/
          if-no-files-found: error
          retention-days: 7

