name: CL Nexus - validacion pre-publicacion
on:
  push:
    branches: [cln-lanzamiento-controlado-20261119, cln-sesion-unica-20261119, cln-redisenio-liquidglass-20261119, cln-mejoras-ui-busqueda-20261119, cln-un-solo-login-reparacion-20261119, cln-contratos-cliente-dui-vendedor-20261119, fix-seller-panel-scope-20261119, cln-inventario-imprimir-20261120, cln-ajustes-auditoria-modulos-20261120, fix-cln-historial-rol-ambiguo-20261120, cln-entradas-aprobacion-sin-uuid-20261120, cln-login-persistente-sin-doble-pantalla-20261123, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwa-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static safety, correct scripts and release cache
        run: |
          node --check scripts/cln-release-smoke.mjs
          node scripts/cln-release-smoke.mjs
          node --check cl-nexus-reader.cjs
          node --check cl-nexus-actions.cjs
          node --check cln-http-auth-probe.cjs
          node --check debt-gate-client.cjs
          node --check debt-module-controller.cjs
          node --check debt-cache-preflight.cjs
          node --check debt-legacy-backup.cjs
          node --check debt-encrypted-backup.cjs
