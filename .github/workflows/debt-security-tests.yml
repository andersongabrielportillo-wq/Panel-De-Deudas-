name: CL Nexus debt security tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'debt-gate-client.cjs'
      - 'tests/**'
      - '.github/workflows/debt-security-tests.yml'
  push:
    branches:
      - integracion-inventario-fase15
    paths:
      - 'index.html'
      - 'debt-gate-client.cjs'
      - 'tests/**'
      - '.github/workflows/debt-security-tests.yml'
permissions:
  contents: read
jobs:
  debt-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify debt gate and PWA integration
        run: node --test tests/debt-gate-client.test.cjs tests/debt-module-controller.test.cjs tests/pwa-debt-integration.test.cjs
