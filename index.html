// Versión pública segura: no contiene deudas, contactos, teléfonos ni saldos precargados.
const SEED=[];

const KINDS={amort:"Con interés",free:"Sin interés",io:"Solo interés",single:"Pago único",mora:"Deuda vencida"};
const CATS={fin:"Financiero",part:"Particular",inv:"Inventario",mora:"Vencida"};
const METH=["Efectivo","Transferencia","Depósito","Tarjeta","Otro"];
const O_ORIG={};
const EST=[];
const r2=n=>Math.round((+n||0)*100+ (n<0?-1e-9:1e-9))/100;
const money=n=>(+n||0).toLocaleString("en-US",{style:"currency",currency:"USD"});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pd=s=>{if(!s)return null;const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayD=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
let T=todayD();

  if(bal(d)<=0.005)return"Esta deuda ya está liquidada.";

    if(b.t.id==="__new"){
      if(b.kind==="io")return"En «Solo interés» la cuota no puede pasar del interés pendiente del período ("+money(b.irem)+" de interés). Para bajar capital registra un «Abono extra a capital».";

function persist(rec){

    if(rec){const cur=lsGet("cp_v2");if(cur){const o=norm(JSON.parse(cur));if(o&&sig(o)!==sig(S)){const g=merge(S,o,SY.known);if(g.changedLocal){S=g.m;S.rev=Math.max(S.rev||0,o.rev||0)+1;tellNotes(g.notes);setTimeout(uiRefresh,0)}}}}
    const j=JSON.stringify(S);if(!norm(JSON.parse(j)))throw new Error("los datos no pasaron la validación");

async function push(){

function onRemote(s){

  const d=s.data()||{};if(d.dev===DEV)return;
  let o=null;try{o=norm(JSON.parse(d.j))}catch(e){}
  if(!o){sv("⚠ La nube devolvió datos no válidos; se conserva lo de este dispositivo",1);SY.pend=true;schedulePush(500);return}
  if((S.rev||0)===0&&!S.tx.length&&!(S.del&&Object.keys(S.del).length)){ // dispositivo nuevo sin cambios propios: adopta lo de la nube tal cual (evita resucitar deudas de ejemplo ya borradas)
    S=clone(o);persist(false);SY.known={};S.debts.forEach(x=>SY.known[x.id]=x.mt||0);uiRefresh();sv("Sincronizado "+hm());return}
  const g=merge(S,o,SY.known);
  if(g.reset&&g.changedLocal){lsSet("cp_prev",JSON.stringify(S))}
  if(g.changedLocal||g.changedRemote){g.m.rev=Math.max(S.rev||0,o.rev||0)+1;g.m.ts=Date.now()}
  if(g.changedLocal){S=g.m;tellNotes(g.notes);persist(false);uiRefresh();sv("Actualizado desde otro dispositivo "+hm())}
  else if(g.notes.length)tellNotes(g.notes);
  g.m.debts.forEach(x=>SY.known[x.id]=x.mt||0);
  if(g.changedRemote){if(!g.changedLocal)S.rev=g.m.rev;SY.pend=true;lsSet("cp_pend","1");schedulePush(300)}

}

sec("1. Primeros pasos (léelo primero)",`<p>Esta app lleva el control de todo lo que debes: bancos, tarjetas, particulares, proveedores de inventario y deudas vencidas. Para cada deuda sabe cuánto falta, cuándo toca pagar y cuánto es la cuota, y se actualiza al instante cada vez que registras un pago.</p><ol><li>Abre <b>Deudas</b> y toca una tarjeta para ver su ficha.</li><li>Cuando pagues, toca <b>Registrar pago</b>, revisa la vista previa y toca <b>Guardar pago</b>.</li><li>Mira <b>Inicio</b> para el resumen y <b>Calendario</b> para saber qué toca pagar en los próximos días.</li><li>De vez en cuando, ve a <b>Datos</b> y descarga una copia de seguridad.</li></ol><p>Las secciones están arriba, en la barra de botones: Inicio, Deudas, Movimientos, Calendario, Presupuesto, Informes, Datos, Excel y Guía. En computadora están en la barra lateral izquierda. En el celular están abajo: Inicio, Deudas, Movimientos y Calendario, y el botón “Más” abre el resto. Arriba tienes el buscador (te lleva a Deudas con el filtro puesto), el botón “Nueva deuda” y el botón de tema claro u oscuro.</p>`,1)+
sec("2. Parte de arriba: guardado, tema y alerta",`<ul><li><b>Texto pequeño junto al título:</b> dice si tus datos se guardaron. “Cargado” al abrir; “Guardando…” mientras guarda; “Guardado 10:32” cuando terminó; “Guardado en este dispositivo” si solo se guardó en tu teléfono o computadora. En rojo (⚠) significa que hubo un problema: descarga una copia en Datos.</li><li><b>Botón de luna (tema):</b> cambia entre modo claro y oscuro. Se recuerda para la próxima vez.</li><li><b>⏰ Atención (cuadro rojo):</b> aparece solo cuando hay pagos vencidos, que vencen hoy o que vencen mañana. Dice “vencido hace N d”, “vence HOY” o “vence MAÑANA”, con el nombre y el monto. No aparecen las deudas archivadas ni las deudas vencidas sin fecha.</li></ul>`)+
sec("3. Inicio: el resumen general",`<p>La tarjeta azul grande muestra el <b>saldo pendiente</b> con una barra de avance del porcentaje liquidado, el monto original y el capital pagado (incluye lo pagado antes de usar la app). Los cuadros solo cuentan deudas no archivadas.</p><ul><li><b>Total de deudas:</b> cuántas deudas activas tienes y su monto original.</li><li><b>Próximos pagos (30 días):</b> dinero necesario en 30 días; debajo, lo de 7 y 15 días.</li><li><b>Deudas vencidas:</b> pagos con fecha pasada más las deudas vencidas. En rojo si hay algo.</li><li><b>Pagos del mes:</b> lo que registraste este mes, comparado con el mes anterior (solo si hubo pagos antes).</li><li><b>Intereses pagados</b> (solo pagos registrados), <b>Cuotas pendientes</b> (capital más interés) e <b>Interés futuro estimado</b>.</li></ul><p><b>Gráficas:</b> saldo por categoría (dona); pagos registrados por mes (últimos 6); saldo por acreedor (10 mayores); tasas más altas en anual equivalente (mensual ×12, cada 14 días ×26); próximos pagos y últimos movimientos. Si no hay datos, cada una lo dice.</p>`)+
sec("3.1 Presupuesto",`<p>Muestra el compromiso del mes actual: lo ya <b>pagado</b> (pagos registrados este mes) más lo <b>por pagar</b> (plan de pagos de este mes, incluyendo lo vencido de meses anteriores), con barra de avance. También muestra el compromiso del próximo mes, las deudas vencidas sin fecha, una tabla por categoría y la lista de pagos por hacer. Todo se calcula solo; no hay montos que escribir.</p>`)+
sec("3.2 Informes",`<p>Resumen por categoría (deudas, saldo, original, % pagado, interés pagado), estado de cada deuda con tasa anual equivalente y próximo pago, y pagos por mes (capital e interés). Arriba hay botones para exportar deudas y movimientos en CSV y para descargar la copia de seguridad.</p>`)+
sec("4. Deudas: la lista",`<ul><li><b>Buscar:</b> escribe parte del nombre, contacto, teléfono o referencia; la lista se filtra mientras escribes.</li><li><b>Categoría:</b> Financiero, Particular, Inventario o Vencida.</li><li><b>Estado:</b> Activas (con saldo), Vencidas, Liquidadas, Archivadas o Todas.</li><li><b>Orden:</b> por fecha del próximo pago, por saldo (mayor primero) o por tasa (más alta primero).</li><li><b>+ Agregar:</b> crea una deuda nueva (ver sección 7).</li><li>Debajo de los filtros ves cuántas cuentas hay y su saldo sumado.</li></ul><p><b>La tarjeta de cada deuda</b> muestra: el nombre (con ⚠ si sus datos son estimados), una etiqueta de estado, el saldo, y la fecha y monto del próximo pago con los días que faltan.</p><ul><li><b>Vencido (rojo):</b> la fecha ya pasó, o es una deuda vencida.</li><li><b>Esta semana (ámbar):</b> toca en 7 días o menos. <b>Este mes (ámbar):</b> en 30 días o menos.</li><li><b>Al día (verde):</b> falta más de 30 días. <b>Liquidada / Archivada (gris):</b> ya no se cobra.</li><li><b>Sin fecha:</b> falta la fecha para calcular.</li></ul><p>El ⚠ significa “datos por confirmar”: la tasa, el plazo o la fecha se supusieron. Corrígelos en Editar cuando tengas el dato real.</p>`)+
sec("5. La ficha de una deuda (toca una tarjeta)",`<p>Arriba ves la categoría, el tipo, el estado y el contacto. Si hay teléfono, tócalo para llamar.</p><ul><li><b>Indicadores:</b> saldo actual, monto original, capital pagado, interés pagado (en la app), próximo pago (fecha y monto) y último pago estimado.</li><li><b>Avisos en amarillo:</b> “La cuota no cubre ni el interés” (el saldo no baja, hay que subir la cuota); “Con esta cuota termina después de la fecha de vencimiento” (necesitas pagar más para cumplir la fecha).</li></ul><p><b>Botones:</b></p><ul><li><b>Registrar pago:</b> anota un pago (sección 6). No aparece si la deuda está liquidada o archivada.</li><li><b>Editar:</b> cambia los datos de la deuda (sección 7).</li><li><b>Archivar / Reactivar:</b> archivar la saca de los totales, alertas y calendario sin borrarla. Reactivar la devuelve.</li><li><b>🔔 Recordatorios:</b> descarga un archivo de calendario (.ics) con los próximos pagos de esa deuda; ábrelo para agregarlos a tu calendario con aviso un día antes.</li><li><b>Eliminar:</b> solo aparece si la deuda nunca tuvo pagos registrados; pide confirmación. Si ya tiene pagos, usa Archivar.</li></ul><p><b>Plan de pagos:</b> tabla calculada desde el saldo actual con número de pago, fecha, pago, interés, capital y saldo. Abajo ves el total a pagar y el interés total. En las deudas de solo interés muestra 12 meses y el capital no baja.</p><p><b>Historial:</b> los pagos de esa deuda con fecha, monto, capital, interés y saldo después. Cada uno tiene botón <b>Anular</b>.</p>`)+
sec("6. Registrar un pago",`<p>Entra a la ficha y toca <b>Registrar pago</b>. Llena:</p><ul><li><b>Fecha:</b> el día que pagaste (por defecto, hoy).</li><li><b>Monto:</b> lo que entregaste. Viene con la cuota sugerida; cámbialo si pagaste otra cantidad, más o menos.</li><li><b>Tipo:</b> “Cuota” o “Abono extra a capital”.</li><li><b>Cargos / comisiones:</b> lo que cobró el banco o el servicio de pago. No baja la deuda.</li><li><b>Método:</b> efectivo, transferencia, depósito, tarjeta u otro. <b>Referencia:</b> número de comprobante. <b>Nota:</b> lo que quieras recordar.</li></ul><p><b>Vista previa (cuadro de abajo):</b> se actualiza mientras escribes y muestra interés, cargos, capital y el saldo de antes → después. Revísala antes de guardar.</p><p><b>Cómo se reparte el monto:</b></p><ul><li><b>Cuota en deuda con interés:</b> primero se paga el interés del período (saldo × tasa), y lo que sobra, menos los cargos, baja el capital. Si el monto no cubre el interés, la vista previa te avisa. <b>Cuota en solo interés:</b> solo puede pagar el interés pendiente; si pagas más, la app no lo deja pasar. Para bajar capital usa «Abono extra a capital».</li><li><b>Abono extra:</b> todo (menos cargos) baja el capital, sin pagar interés. Úsalo para adelantar dinero.</li><li><b>Deudas sin interés y pagos únicos:</b> todo el monto baja el saldo.</li></ul><p><b>Importante sobre la fecha:</b> una “Cuota” corre el próximo vencimiento un período (un mes, o 14 días en Banco Acceso) solo cuando lo pagado en ese período cubre la cuota completa. Si pagas menos, queda registrado como pago parcial: el interés del período se cobra una sola vez, el vencimiento no avanza y la ficha muestra lo que falta de la cuota. Si pagas más, el excedente baja el capital. Un “Abono extra” no mueve la fecha. En pagos únicos y deudas vencidas la fecha no se mueve.</p><p><b>La app te frena si:</b> el monto es cero; los cargos son iguales o mayores al monto; la fecha no es válida; la deuda ya está liquidada; el abono supera el saldo; o ya existe un pago igual (misma fecha, monto y referencia). Si es otro pago real, cambia la referencia. Cuando todo está bien, toca <b>Guardar pago</b>: el saldo, el plan, el panel y el calendario se actualizan al instante.</p><p><b>Pagos con fecha anterior y anulaciones:</b> si registras un pago con una fecha anterior a otros, o anulas uno antiguo, la app vuelve a calcular en orden cronológico el interés y el capital de los pagos posteriores (la vista previa te dice cuántos cambian). Los pagos anteriores a las reglas de períodos y los registrados antes de un ajuste de saldo se conservan tal como se guardaron.</p><p><b>¿Te equivocaste?</b> Toca <b>Anular</b> en el historial; el saldo se recalcula y el pago queda marcado como anulado (no se borra). Luego registra el correcto.</p>`)+
sec("7. Agregar o editar una deuda",`<p>Campos del formulario:</p><ul><li><b>Acreedor / nombre:</b> obligatorio y no puede repetirse.</li><li><b>Categoría:</b> Financiero, Particular, Inventario o Vencida.</li><li><b>Tipo:</b> <i>Con interés</i> (cuota fija con interés sobre saldo); <i>Sin interés</i> (cuotas fijas sin interés, como proveedores de inventario); <i>Solo interés</i> (se paga solo el interés y el capital no baja); <i>Pago único</i> (todo en una fecha límite); <i>Deuda vencida</i> (ya venció, sin plan).</li><li><b>Contacto y teléfono:</b> opcionales; el teléfono se puede tocar para llamar.</li><li><b>Monto original:</b> lo que se debía al principio.</li><li><b>Saldo inicial</b> (deuda nueva) o <b>Saldo actual</b> (al editar).</li><li><b>Interés % por período</b> y <b>Período</b> (mensual o cada 14 días).</li><li><b>Cuota ($)</b> y <b>Próximo vencimiento:</b> fecha del próximo pago.</li><li><b>Fecha límite:</b> el vencimiento final. <b>Fecha de adquisición</b> y <b>Referencia:</b> opcionales.</li><li><b>¿Datos estimados?:</b> “Sí” pone el ⚠ hasta que confirmes.</li></ul><p><b>Obligatorio según el tipo:</b> con interés y sin interés piden cuota mayor que cero y próximo vencimiento; con interés pide tasa mayor que cero; solo interés pide próximo vencimiento; pago único pide fecha límite. Si falta algo, la app lo dice en amarillo y no guarda.</p><p>Al editar el saldo, la app crea un “ajuste” en el Registro de cambios y no toca el historial de pagos. Si cambias el tipo, la tasa, el período o la cuota de una deuda que ya tiene pagos, la app te avisa: los cambios rigen solo para pagos con fecha posterior y los pagos anteriores conservan sus condiciones.</p>`)+
sec("8. Movimientos",`<p>Lista de todos los pagos de todas las deudas.</p><ul><li><b>Filtros:</b> por deuda, por estado (Vigentes, Anulados, Todos) y por rango de fechas Desde / Hasta.</li><li><b>Columnas:</b> fecha, deuda, monto, capital, interés, cargos, saldo antes y después, método y referencia.</li><li>Abajo ves el total vigente de lo filtrado.</li><li><b>Exportar CSV:</b> genera un archivo que se abre en Excel con todos los movimientos.</li><li><b>Anular:</b> igual que en el historial; pide confirmación y un motivo opcional.</li></ul>`)+
sec("9. Calendario",`<p>Muestra los pagos de los próximos 90 días, agrupados por mes, con el total de cada mes. Lo vencido sale primero en un grupo llamado “Vencidos”, con el monto en rojo.</p><ul><li>Cada línea dice el nombre, la fecha, los días que faltan, si es cuota, interés o pago total, y el teléfono.</li><li><b>Categoría:</b> filtra por Financiero, Particular, etc.</li><li><b>🔔 Descargar recordatorios (.ics):</b> crea los eventos de los próximos 120 días con aviso un día antes (9:00 a. m.). Ábrelo desde tu celular o computadora para añadirlos a tu calendario.</li><li><b>✔ Pagados (últimos 30 días):</b> pagos que registraste recientemente.</li><li>Las deudas vencidas sin fecha y las archivadas no aparecen aquí.</li></ul>`)+
sec("10. Datos: copias de seguridad y registro",`<ul><li><b>Descargar copia (.json):</b> guarda todo (deudas, pagos y registro). Hazlo seguido, por ejemplo cada semana.</li><li><b>Restaurar copia:</b> elige un archivo .json. La app lo revisa; si es válido te muestra cuántas deudas y movimientos tiene y pide confirmar. Antes de reemplazar guarda una copia de lo actual y puedes volver con <b>Recuperar estado anterior</b>. Si el archivo no sirve, no cambia nada.</li><li><b>Exportar deudas (CSV):</b> lista de deudas con saldo, tasa, cuota y fechas, para abrir en Excel.</li><li><b>Registro de cambios:</b> los últimos 30 movimientos de la app (pagos, ajustes, ediciones, anulaciones, archivados).</li></ul><p><b>Dónde se guardan los datos:</b> en tu dispositivo y, si el visor lo permite, en una base compartida que sincroniza tus dispositivos: si guardas en el celular, la computadora se actualiza. Si tu visor no deja descargar, la app muestra un cuadro de texto: copia el contenido y guárdalo en un archivo con el nombre indicado.</p>`)+
sec("11. Excel",`<p>La sección <b>Excel</b> tiene un botón que abre tu archivo en OneDrive. Recuerda que es un archivo aparte: lo que registres en la app no se copia solo al Excel.</p>`)+
sec("12. Rutina recomendada y preguntas frecuentes",`<ul><li><b>Cada día:</b> mira el cuadro “Atención”. <b>Cada pago:</b> regístralo ese mismo día. <b>Cada semana:</b> revisa Calendario y descarga una copia. <b>Cada mes:</b> confirma los datos con ⚠ y compara con tus estados de cuenta.</li><li><b>Me equivoqué en un pago:</b> Anular, y registra el correcto.</li><li><b>La fecha no avanzó:</b> lo registraste como Abono extra, o el pago fue parcial y aún falta parte de la cuota (la ficha dice cuánto). Para que avance, completa la cuota.</li><li><b>El saldo no coincide con mi banco:</b> pudo haber intereses o cargos que no estén registrados. Ajusta el saldo en Editar; queda anotado en el registro.</li><li><b>Pagué antes de usar la app:</b> esos pagos no están en el historial; el saldo que cargaste ya los incluye.</li><li><b>No quiero ver una deuda:</b> Archívala (se puede reactivar).</li><li><b>Se ve muy brillante o muy oscuro:</b> usa ◐ Tema.</li></ul>`);}
async function dl(name,data){
  let svc=null;try{if(typeof claude!=="undefined"&&claude&&claude.use)svc=await claude.use("downloads")}catch(e){}
  if(svc){try{await svc.save({filename:name,data});sv("Archivo enviado: "+name);toast("Archivo enviado");return}catch(e){}}
  else{try{const ty=/\.json$/.test(name)?"application/json":/\.ics$/.test(name)?"text/calendar":"text/csv",u=URL.createObjectURL(new Blob([data],{type:ty+";charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);sv("Archivo descargado: "+name);toast("Archivo descargado");return}catch(e){}}
  dlg.dataset.m="x";dlg.innerHTML=`<div class="r1"><b>Tu visor no permite descargar aquí</b><button class="g2" data-act="close">✕</button></div><div class="r2">Copia este contenido y guárdalo en un archivo ${esc(name)}:</div><textarea readonly style="width:100%;height:240px;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:8px">${esc(data)}</textarea>`;if(!dlg.open)dlg.showModal();
}
const csv=rows=>rows.map(r=>r.map(c=>{const isS=typeof c==="string";c=String(c==null?"":c);if(isS&&/^[=+\-@]/.test(c))c="'"+c;return/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")).join("\r\n");
async function mkics(list){
  const z=n=>String(n).padStart(2,"0"),st=d=>d.getFullYear()+z(d.getMonth()+1)+z(d.getDate()),ev=[];
  list.forEach(d=>{if(d.arch||d.kind==="mora")return;sched(view(d)).rows.slice(0,24).forEach(r=>{if(!r.d||dd(r.d)<1||dd(r.d)>120)return;
    ev.push(["BEGIN:VEVENT","UID:"+d.id+"-"+r.n+"-"+st(r.d)+"@control-pagos","DTSTAMP:"+st(T)+"T000000Z","DTSTART:"+st(r.d)+"T090000","DTEND:"+st(r.d)+"T093000","SUMMARY:"+("Pagar "+d.name+" "+money(r.pay)).replace(/[,;]/g," "),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Mañana toca pagar","TRIGGER:-P1D","END:VALARM","END:VEVENT"].join("\r\n"))})});
  if(!ev.length){sv("No hay pagos próximos para recordar.");return}
  dl("recordatorios-pagos.ics","BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Control de pagos//ES\r\n"+ev.join("\r\n")+"\r\nEND:VCALENDAR\r\n");
}
function confirmD(msg,act,attrs){dlg.dataset.m="c";dlg.innerHTML=`<p>${msg}</p><div class="row"><button class="dn" data-act="${act}" ${attrs}>Confirmar</button><button class="g2" data-act="close">Cancelar</button></div>`;if(!dlg.open)dlg.showModal()}
document.addEventListener("click",e=>{if(!APP_READY)return;
  const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;if(dlg.open)dlg.close();render();window.scrollTo(0,0);return}
  const o=e.target.closest("[data-open]");if(o){showDebt(o.dataset.open);return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act,id=a.dataset.id;
  if(act==="close"){dlg.close();render()}
  else if(act==="more"){dlg.innerHTML=`<div class="r1"><b style="font-size:17px">Más secciones</b><button class="g2" data-act="close" aria-label="Cerrar">✕</button></div><div class="mo" style="margin-top:12px">${TABS.slice(4).map(([k,n,c])=>`<button class="g2" data-tab="${k}">${ic(c)}${n}</button>`).join("")}</div>`;dlg.showModal()}
  else if(act==="back")showDebt(id);
  else if(act==="newdebt"){debtDlg(null);dlg.showModal()}
  else if(act==="edit")debtDlg(id);
  else if(act==="debtsave")saveDebt(id||null);
  else if(act==="pay")payDlg(id);
  else if(act==="paysave"){const d=S.debts.find(x=>x.id===id);if(!d){toast("Esa deuda ya no existe.",1);dlg.close();render();return}const e2=addTx(d,fv());if(e2){$("#pe").textContent=e2;toast(e2,1);return}save();render();showDebt(id);toast(lastRebuild?"Pago registrado · se recalculó el reparto de "+lastRebuild+" movimiento(s) posterior(es)":"Pago registrado")}
  else if(act==="arch"){const d=S.debts.find(x=>x.id===id);if(!d)return;d.arch=!d.arch;d.mt=Date.now();logm((d.arch?"Archivada: ":"Reactivada: ")+d.name);save();render();showDebt(id);toast(d.arch?"Deuda archivada":"Deuda reactivada")}
  else if(act==="del")confirmD("¿Eliminar esta deuda? Solo es posible porque no tiene pagos registrados.","delok",`data-id="${id}"`);
  else if(act==="delok"){const d=S.debts.find(x=>x.id===id);if(!d||S.tx.some(t=>t.debt===id)){dlg.close();render();toast("No se puede eliminar: la deuda tiene pagos. Usa Archivar.",1);return}S.debts=S.debts.filter(x=>x.id!==id);S.del=S.del||{};S.del[id]=Date.now();logm("Deuda eliminada: "+d.name);save();dlg.close();render();toast("Deuda eliminada")}
  else if(act==="annul")confirmD("¿Anular este pago? El saldo se recalcula; el movimiento queda registrado como anulado.<br><input id='aw' placeholder='Motivo (opcional)' style='width:100%;margin-top:8px;padding:8px'>","annulok",`data-t="${a.dataset.t}"`);
  else if(act==="annulok"){const w=document.getElementById("aw");annul(a.dataset.t,w?w.value:"");save();const x=S.tx.find(q=>q.id===a.dataset.t);dlg.close();render();if(x)showDebt(x.debt);toast(lastRebuild?"Pago anulado · se recalculó el reparto de "+lastRebuild+" movimiento(s)":"Pago anulado")}
  else if(act==="ics")mkics([S.debts.find(x=>x.id===id)]);
  else if(act==="icsall")mkics(S.debts.filter(d=>!CF||d.cat===CF));
  else if(act==="backup"){const j=JSON.stringify(S,null,1);let ok=false;try{ok=!!norm(JSON.parse(j))}catch(e){}if(!ok){toast("La copia no pasó la validación; no se descargó.",1);return}dl("control-pagos-copia-"+iso(T)+".json",j)}
  else if(act==="csvtx"){const rows=[["Fecha","Deuda","Monto","Capital","Interés","Cargos","Saldo antes","Saldo después","Método","Referencia","Estado","Nota"]];S.debts.forEach(d=>ledger(d).forEach(t=>rows.push([t.date,d.name,t.amount,t.cap,t.int,t.fee,t.b4,t.af,t.method,t.ref,t.status,t.note])));dl("movimientos-"+iso(T)+".csv","\ufeff"+csv(rows))}
  else if(act==="csvdebts"){const rows=[["Acreedor","Categoría","Tipo","Original","Saldo actual","Tasa % período","Período","Cuota","Próximo pago","Fecha límite","Estimado"]];S.debts.forEach(d=>{const v=view(d);rows.push([d.name,CATS[d.cat],KINDS[d.kind],d.orig,v.saldo,d.rate,d.per,d.cuota,v.next,d.venc,d.est?"sí":"no"])});dl("deudas-"+iso(T)+".csv","\ufeff"+csv(rows))}
  else if(act==="restok"||act==="undook"){const n=norm(window.__rest);if(!n){toast("La copia ya no es válida; no se cambió nada.",1);return}
    if(!lsSet("cp_prev",JSON.stringify(S))){toast("No hay espacio para guardar el estado anterior; no se restauró nada.",1);return}
    const old=S;n.gen=Date.now();n.rev=Math.max(n.rev||0,old.rev||0)+1;n.ts=Date.now();S=n;logm(act==="undook"?"Estado anterior recuperado":"Copia restaurada");

<script>
/* Actualizaciones PWA: no recargar con pagos pendientes ni mientras se guarda. */
(function(){
  if(!('serviceWorker' in navigator) || !(location.protocol==='https:' || location.hostname==='localhost'))return;
  const box=document.getElementById('pwaUpdate'),msg=document.getElementById('pwaUpdateText');
  const apply=document.getElementById('pwaApply'),later=document.getElementById('pwaLater');
  let reg=null,waiting=null,requested=false,refreshing=false;
  const pending=()=>typeof SY!=='undefined' && (SY.pend || SY.pushing || localStorage.getItem('cp_pend')==='1');
  function show(worker){if(!worker)return;waiting=worker;box.hidden=false;msg.textContent=pending()?'Nueva versión lista. Primero espera a que tus cambios se sincronicen con Supabase.':'Hay una nueva versión del Panel de Deudas lista para instalar.';apply.disabled=false;}
  apply.addEventListener('click',()=>{
    if(pending()){msg.textContent='Hay cambios pendientes. Espera a que aparezca «Sincronizado» y vuelve a intentarlo.';return;}
    if(!waiting)return;
    requested=true;apply.disabled=true;msg.textContent='Aplicando actualización…';waiting.postMessage({type:'SKIP_WAITING'});
  });
  later.addEventListener('click',()=>{box.hidden=true;});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    if(!requested){if(reg&&reg.waiting)show(reg.waiting);return;}
    if(pending()){requested=false;show(reg&&reg.waiting);msg.textContent='Se detectaron cambios pendientes. Termina de sincronizar antes de recargar.';return;}
    refreshing=true;location.reload();
  });
  function check(){if(reg&&navigator.onLine!==false)reg.update().catch(()=>{});}
  window.addEventListener('load',async()=>{
    try{
      const hadController=!!navigator.serviceWorker.controller;
      reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
      if(hadController&&reg.waiting)show(reg.waiting);
      reg.addEventListener('updatefound',()=>{
        const w=reg.installing;if(!w)return;
        w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(reg.waiting||w);});
      });
      check();
      setInterval(check,15*60*1000);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});
      window.addEventListener('online',check);
    }catch(err){console.warn('Actualización PWA:',err);}
  });
})();

 var intro=$("#lgIntro"),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
 setTimeout(function(){if(intro)intro.remove();pulse()},rm?550:1850);
 d.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("[data-tab]"))pulse()});
 /* Clasificación visual del estado de sincronización (no cambia el texto ni la lógica) */
 var sv=$("#sv");
 if(sv&&window.MutationObserver){var paint=function(){var t=sv.textContent||"",s="";
  if(/^⚠|Sin conexión|No se pudo/.test(t))s="er";else if(/^(Sincronizando|Guardando)/.test(t))s="sp";else if(/^Guardado en este dispositivo/.test(t))s="loc";else if(t)s="ok";
  if(sv.getAttribute("data-st")!==s)s?sv.setAttribute("data-st",s):sv.removeAttribute("data-st")};
  new MutationObserver(paint).observe(sv,{childList:true,characterData:true,subtree:true,attributes:true,attributeFilter:["class"]});paint()}
 /* Mostrar/ocultar contraseña (el input conserva su id y sus eventos) */
 var p=$("#authPass");
 if(p&&p.parentNode&&!p.parentNode.classList.contains("pw")){var w=d.createElement("div");w.className="pw";p.parentNode.insertBefore(w,p);w.appendChild(p);
  var b=d.createElement("button");b.type="button";b.setAttribute("aria-label","Mostrar u ocultar contraseña");
  b.innerHTML='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  b.onclick=function(){p.type=p.type==="password"?"text":"password"};w.appendChild(b)}
 /* Indicador de espera durante el inicio de sesión */
 var er=$("#authErr");
 if(er&&window.MutationObserver){var f=function(){/^Entrando/.test(er.textContent)?er.setAttribute("data-wait",""):er.removeAttribute("data-wait")};new MutationObserver(f).observe(er,{childList:true,characterData:true,subtree:true})}
})();
</script>
